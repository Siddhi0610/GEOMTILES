<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GEOMTILES - Tile Debug View</title>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            padding: 12px 16px;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="cesiumContainer"></div>

<div id="info">
    <strong>3D Tiles Debug View</strong><br>
    Each tile i.e. apartment flat is automatically colorized
</div>

<script>

    const viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false
        
    });

   


    async function loadTileset() {

        const tileset = await Cesium.Cesium3DTileset.fromUrl(
            "./output/tileset.json"
        );

        /*
         * Cesium automatically assigns a different
         * debug color to each tile.
         */
        tileset.debugColorizeTiles = true;

        viewer.scene.primitives.add(tileset);

        await tileset.readyPromise;

        viewer.camera.viewBoundingSphere(
            tileset.boundingSphere,
            new Cesium.HeadingPitchRange(
                0,
                -0.5,
                100
            )
        );
    }


    loadTileset();

</script>

</body>
</html>
