<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GEOMTILES - Tile Debug View</title>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            padding: 12px 16px;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="cesiumContainer"></div>

<div id="info">
    <strong>3D Tiles Debug View</strong><br>
    Click a flat
</div>

<script>

    const viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false
    });


    /*
     * PROPERTY DATA
     *
     * Each flat has its own Owner and 3DULPIN.
     */

    const flatData = {

        flat1: {
            owner: "A",
            ulpin: "MH0493PA1234PA-B-14-04"
        },

        flat2: {
            owner: "B",
            ulpin: "MH0493PA1234PA-B-14-05"
        },

        flat3: {
            owner: "C",
            ulpin: "MH0493PA1234PA-B-14-06"
        },

        flat4: {
            owner: "D",
            ulpin: "MH0493PA1234PA-B-14-07"
        },

        flat5: {
            owner: "E",
            ulpin: "MH0493PA1234PA-B-14-08"
        },

        flat6: {
            owner: "F",
            ulpin: "MH0493PA1234PA-B-14-09"
        },

        flat7: {
            owner: "G",
            ulpin: "MH0493PA1234PA-B-14-10"
        },

        flat8: {
            owner: "H",
            ulpin: "MH0493PA1234PA-B-14-11"
        },

        flat9: {
            owner: "I",
            ulpin: "MH0493PA1234PA-B-14-12"
        },

        flat10: {
            owner: "J",
            ulpin: "MH0493PA1234PA-B-14-13"
        }

    };


    async function loadTileset() {

        const tileset = await Cesium.Cesium3DTileset.fromUrl(
            "./output/tileset.json"
        );

        tileset.debugColorizeTiles = true;

        viewer.scene.primitives.add(tileset);

        await tileset.readyPromise;

        viewer.camera.viewBoundingSphere(
            tileset.boundingSphere,
            new Cesium.HeadingPitchRange(
                0,
                -0.8,
                80
            )
        );
    }


    /*
     * CLICK DETECTION
     */

    viewer.screenSpaceEventHandler.setInputAction(function (click) {

        const pickedObject = viewer.scene.pick(click.position);


        /*
         * Nothing clicked
         */

        if (!Cesium.defined(pickedObject)) {

            document.getElementById("info").innerHTML =
                "<strong>Nothing selected</strong><br>" +
                "Click directly on a flat";

            return;
        }


        /*
         * Find the tile containing the clicked geometry.
         */

        let tile = null;


        if (Cesium.defined(pickedObject.tile)) {
            tile = pickedObject.tile;
        }


        if (
            !tile &&
            Cesium.defined(pickedObject.content) &&
            Cesium.defined(pickedObject.content.tile)
        ) {
            tile = pickedObject.content.tile;
        }


        /*
         * Walk through the nested tile hierarchy.
         */

        let currentTile = tile;


        while (currentTile) {

            if (Cesium.defined(currentTile.content)) {

                const content = currentTile.content;

                const url = content.url || "";

                console.log("CONTENT URL:", url);


                /*
                 * Check which flat was clicked.
                 */

                for (const flatName in flatData) {

                    if (
                        url.includes(flatName) ||
                        url.includes(
                            flatName.replace("flat", "flat_")
                        )
                    ) {

                        const data = flatData[flatName];


                        /*
                         * Display the property information.
                         */

                        document.getElementById("info").innerHTML =
                            "<strong>" +
                            flatName.toUpperCase() +
                            "</strong><br>" +
                            "Owner: " +
                            data.owner +
                            "<br>" +
                            "3DULPIN: " +
                            data.ulpin;


                        return;
                    }
                }
            }


            currentTile = currentTile.parent;
        }


        /*
         * Something was clicked, but it wasn't
         * one of our ten flats.
         */

        document.getElementById("info").innerHTML =
            "<strong>Flat clicked</strong><br>" +
            "No property data assigned";

    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);


    loadTileset();

</script>

</body>
</html>
